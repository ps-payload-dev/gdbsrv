name: Build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          repository: ps-payload-dev/sdk
          path: sdk

      - name: Set up both SDKs
        working-directory: sdk
        run: |
          sudo apt update
          sudo apt install clang-18 lld-18
          make DESTDIR=${{ runner.tool_cache }}/ps-payload-sdk clean install
          echo PS4_PAYLOAD_SDK=${{ runner.tool_cache }}/ps-payload-sdk/ps4 >> $GITHUB_ENV
          echo PS5_PAYLOAD_SDK=${{ runner.tool_cache }}/ps-payload-sdk/ps5 >> $GITHUB_ENV

      - name: Checkout gdbsrv
        uses: actions/checkout@v4

      - name: Build PS4 and PS5
        run: |
          make PLATFORM=ps4 clean all &
          pid4=$!
          make PLATFORM=ps5 clean all &
          pid5=$!
          wait $pid4 && wait $pid5

      - name: Upload PS4 build
        uses: actions/upload-artifact@v4
        with:
          name: gdbsrv-ps4
          path: |
            build/ps4/gdbsrv-ps4.elf
          if-no-files-found: error

      - name: Upload PS5 build
        uses: actions/upload-artifact@v4
        with:
          name: gdbsrv-ps5
          path: |
            build/ps5/gdbsrv-ps5.elf
          if-no-files-found: error
